<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .label-text {
      font-weight: bold;
      font-size: 14px;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }
    input[type="number"] {
      width: 55px;
      text-align: center;
      padding: 6px 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    .step-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      background-color: #e0e0e0;
      color: #333;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step-btn:hover {
      background-color: #d0d0d0;
    }
    .step-btn:active {
      background-color: #bfbfbf;
    }
    button#resetBtn {
      width: 100%;
      padding: 8px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    button#resetBtn:hover {
      background-color: #0056b3;
    }
    .site-info {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: -4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <span class="label-text">Масштаб:</span>
      <div class="input-group">
        <button class="step-btn" id="zoomDown">−</button>
        <input type="number" id="zoomNumber" min="10" max="500" value="100">
        <button class="step-btn" id="zoomUp">+</button>
        <span style="font-size:16px;">%</span>
      </div>
    </div>
    
    <input type="range" id="zoomSlider" min="10" max="300" step="1" value="100">
    
    <button id="resetBtn">Сбросить на 100%</button>
    
    <div class="site-info" id="siteDomain">Определяем сайт...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
